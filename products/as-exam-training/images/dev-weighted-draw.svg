<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ast-draw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5c8a"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#1e2a3a">加權抽籤：每張卡的權重如何計算</text>
  <text x="20" y="58" font-size="13" fill="#5b6b7f">lib/pick.ts 的 weightOf() 與 drawSession()</text>

  <!-- 步驟 -->
  <g font-size="13">
    <rect x="20" y="84" width="200" height="150" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
    <text x="38" y="112" font-size="15" font-weight="700" fill="#1e2a3a">① 基礎權重</text>
    <text x="38" y="138" fill="#1e2a3a">唔識　　8</text>
    <text x="38" y="160" fill="#1e2a3a">未答過　6</text>
    <text x="38" y="182" fill="#1e2a3a">好勉強　4</text>
    <text x="38" y="204" fill="#1e2a3a">識　　　1.5</text>
    <text x="38" y="226" fill="#1e2a3a">熟到爛　0.4</text>

    <rect x="250" y="84" width="190" height="150" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
    <text x="268" y="112" font-size="15" font-weight="700" fill="#1e2a3a">② 必出題加成</text>
    <text x="268" y="140" fill="#1e2a3a">經人手確認的必出題</text>
    <text x="268" y="166" font-size="20" font-weight="700" fill="#0b5c8a">× 1.6</text>

    <rect x="470" y="84" width="190" height="150" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
    <text x="488" y="112" font-size="15" font-weight="700" fill="#1e2a3a">③ 時間衰減</text>
    <text x="488" y="140" fill="#1e2a3a">超過 7 日未溫　× 1.3</text>
    <text x="488" y="164" fill="#1e2a3a">超過 14 日未溫　× 1.6</text>

    <rect x="690" y="84" width="190" height="150" rx="14" fill="#f4fbfb" stroke="#4be3db"/>
    <text x="708" y="112" font-size="15" font-weight="700" fill="#0b5c8a">④ 抽出一張</text>
    <text x="708" y="140" fill="#1e2a3a">按權重比例隨機抽</text>
    <text x="708" y="162" fill="#1e2a3a">同一節內不重複</text>
    <text x="708" y="184" fill="#1e2a3a">同一來源題最多</text>
    <text x="708" y="206" fill="#1e2a3a">連續兩張</text>
  </g>
  <g stroke="#0b5c8a" stroke-width="1.8" marker-end="url(#ast-draw-arrow)">
    <line x1="222" y1="159" x2="246" y2="159"/>
    <line x1="442" y1="159" x2="466" y2="159"/>
    <line x1="662" y1="159" x2="686" y2="159"/>
  </g>
  <path d="M785 236 L785 260 L120 260 L120 240" fill="none" stroke="#0b5c8a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ast-draw-arrow)"/>
  <text x="330" y="280" font-size="13" fill="#5b6b7f">重複直至抽夠一節的題數（10／20／40）</text>

  <!-- 例子 -->
  <rect x="20" y="300" width="860" height="110" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="38" y="328" font-size="14" font-weight="700" fill="#1e2a3a">例子</text>
  <g font-size="13" fill="#1e2a3a">
    <text x="38" y="354">卡 A：必出題，上次評「唔識」，10 日前　→　8 × 1.6 × 1.3 = 16.6</text>
    <text x="38" y="378">卡 B：一般題，上次評「熟到爛」，2 日前　→　0.4</text>
    <text x="38" y="400" fill="#0b5c8a">同一個池中，卡 A 被抽中的機會約為卡 B 的 40 倍，但卡 B 仍有機會出現，防止遺忘。</text>
  </g>
</svg>
