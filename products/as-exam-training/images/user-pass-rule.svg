<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <text x="24" y="40" font-size="19" font-weight="700" fill="#1e2a3a">面試評分的六個範疇</text>
  <text x="24" y="64" font-size="13" fill="#5b6b7f">根據 PNRC 38 附錄 I 第 3(e) 段；每項評為 Pass、Marginal 或 Fail</text>

  <!-- 一票否決 -->
  <rect x="24" y="86" width="400" height="120" rx="16" fill="#fff5f5" stroke="#f3b4b4"/>
  <text x="44" y="116" font-size="14" font-weight="700" fill="#b91c1c">一票否決：必須兩項皆 Pass</text>
  <rect x="44" y="130" width="176" height="60" rx="12" fill="#ffffff" stroke="#f3b4b4"/>
  <text x="60" y="155" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 1</text>
  <text x="60" y="177" font-size="13" fill="#5b6b7f">法定角色、職能及職責</text>
  <rect x="232" y="130" width="176" height="60" rx="12" fill="#ffffff" stroke="#f3b4b4"/>
  <text x="248" y="155" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 2</text>
  <text x="248" y="177" font-size="13" fill="#5b6b7f">條例目的及管制機制</text>

  <!-- 其餘四項 -->
  <rect x="24" y="224" width="832" height="120" rx="16" fill="#f4fbfb" stroke="#bfeeea"/>
  <text x="44" y="254" font-size="14" font-weight="700" fill="#0b5c8a">其餘四項：至少 2 項 Pass，加 1 項 Marginal</text>
  <g font-size="13">
    <rect x="44" y="268" width="192" height="60" rx="12" fill="#ffffff" stroke="#bfeeea"/>
    <text x="60" y="293" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 3</text><text x="60" y="314" fill="#5b6b7f">本港情況一般認識</text>
    <rect x="248" y="268" width="192" height="60" rx="12" fill="#ffffff" stroke="#bfeeea"/>
    <text x="264" y="293" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 4</text><text x="264" y="314" fill="#5b6b7f">條例、規例及守則</text>
    <rect x="452" y="268" width="192" height="60" rx="12" fill="#ffffff" stroke="#bfeeea"/>
    <text x="468" y="293" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 5</text><text x="468" y="314" fill="#5b6b7f">本地法定程序</text>
    <rect x="656" y="268" width="184" height="60" rx="12" fill="#ffffff" stroke="#bfeeea"/>
    <text x="672" y="293" font-size="15" font-weight="700" fill="#1e2a3a">Aspect 6</text><text x="672" y="314" fill="#5b6b7f">技術知識及實際經驗</text>
  </g>

  <!-- 右上：溫習提示 -->
  <rect x="444" y="86" width="412" height="120" rx="16" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="464" y="116" font-size="14" font-weight="700" fill="#0b5c8a">溫習時間分配提示</text>
  <text x="464" y="144" font-size="14" fill="#1e2a3a">Aspect 1、2 的題目最少，</text>
  <text x="464" y="168" font-size="14" fill="#1e2a3a">但任何一項 Fail 即整體 Fail。</text>
  <text x="464" y="192" font-size="13" fill="#5b6b7f">題目庫以「★」標示這兩項，應優先溫熟。</text>

  <text x="24" y="378" font-size="13" fill="#5b6b7f">Fail 條件：Aspect 1 或 2 任何一項 Fail，或其餘四項多於一項 Fail。兩者皆非則為 Marginal。</text>
</svg>
