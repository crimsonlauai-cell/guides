<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <radialGradient id="ast-hero-glow1" cx="0.75" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4be3db" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4be3db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ast-hero-glow2" cx="0.15" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="ast-hero-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b5c8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="560" height="400" rx="24" fill="#f7fbfd"/>
  <rect width="560" height="400" rx="24" fill="url(#ast-hero-glow1)"/>
  <rect width="560" height="400" rx="24" fill="url(#ast-hero-glow2)"/>

  <!-- 後面兩張卡 -->
  <g transform="rotate(-8 280 200)" opacity="0.7">
    <rect x="150" y="70" width="280" height="190" rx="18" fill="#ffffff" fill-opacity="0.6" stroke="#ffffff" filter="url(#ast-hero-shadow)"/>
  </g>
  <g transform="rotate(5 280 200)" opacity="0.85">
    <rect x="140" y="80" width="290" height="200" rx="18" fill="#ffffff" fill-opacity="0.7" stroke="#ffffff" filter="url(#ast-hero-shadow)"/>
  </g>

  <!-- 前面主卡 -->
  <g filter="url(#ast-hero-shadow)">
    <rect x="120" y="95" width="320" height="215" rx="20" fill="#ffffff" fill-opacity="0.9" stroke="#e3edf3"/>
  </g>
  <rect x="146" y="120" width="58" height="24" rx="12" fill="#4be3db"/>
  <text x="175" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#0f2233">必出題</text>
  <rect x="212" y="120" width="92" height="24" rx="12" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="258" y="137" text-anchor="middle" font-size="12" fill="#5b6b7f">近兩年 84%</text>
  <text x="146" y="182" font-size="21" font-weight="700" fill="#1e2a3a">《建築物條例》的立法目的</text>
  <text x="146" y="210" font-size="21" font-weight="700" fill="#1e2a3a">是甚麼？</text>
  <rect x="146" y="232" width="268" height="10" rx="5" fill="#e8f1f5"/>
  <rect x="146" y="252" width="200" height="10" rx="5" fill="#e8f1f5"/>

  <!-- 四級自評 -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="120" y="326" width="74" height="34" rx="10" fill="#d94a4a"/><text x="157" y="348">唔識</text>
    <rect x="202" y="326" width="74" height="34" rx="10" fill="#e08a2e"/><text x="239" y="348">好勉強</text>
    <rect x="284" y="326" width="74" height="34" rx="10" fill="#3fa15c"/><text x="321" y="348">識</text>
    <rect x="366" y="326" width="74" height="34" rx="10" fill="#159a93"/><text x="403" y="348">熟到爛</text>
  </g>

  <!-- 進度環 -->
  <g transform="translate(468 108)">
    <circle r="40" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff"/>
    <circle r="30" fill="none" stroke="#e3edf3" stroke-width="8"/>
    <circle r="30" fill="none" stroke="#0b5c8a" stroke-width="8" stroke-linecap="round" stroke-dasharray="120 189" transform="rotate(-90)"/>
    <text y="6" text-anchor="middle" font-size="16" font-weight="700" fill="#0b5c8a">64%</text>
  </g>
</svg>
