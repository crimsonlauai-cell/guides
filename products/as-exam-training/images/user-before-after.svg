<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ast-ba-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5c8a"/>
    </marker>
    <linearGradient id="ast-ba-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4be3db" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4be3db" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <!-- 用前 -->
  <rect x="20" y="20" width="370" height="380" rx="18" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="44" y="60" font-size="20" font-weight="700" fill="#5b6b7f">用前：自行溫習</text>
  <g font-size="15" fill="#1e2a3a">
    <circle cx="52" cy="104" r="14" fill="#fef3c7"/><text x="52" y="109" text-anchor="middle" font-size="13" fill="#b45309">1</text>
    <text x="78" y="100">60 份考卷散落各處</text><text x="78" y="122" font-size="13" fill="#5b6b7f">題目重複、字眼簡略，難以歸納</text>
    <circle cx="52" cy="170" r="14" fill="#fef3c7"/><text x="52" y="175" text-anchor="middle" font-size="13" fill="#b45309">2</text>
    <text x="78" y="166">過百份法例、作業備考及教材</text><text x="78" y="188" font-size="13" fill="#5b6b7f">不知道哪一份與哪一題相關</text>
    <circle cx="52" cy="236" r="14" fill="#fef3c7"/><text x="52" y="241" text-anchor="middle" font-size="13" fill="#b45309">3</text>
    <text x="78" y="232">培訓教材部分內容已過時</text><text x="78" y="254" font-size="13" fill="#5b6b7f">數字、條號錯誤難以察覺</text>
    <circle cx="52" cy="302" r="14" fill="#fef3c7"/><text x="52" y="307" text-anchor="middle" font-size="13" fill="#b45309">4</text>
    <text x="78" y="298">無法判斷自己掌握多少</text><text x="78" y="320" font-size="13" fill="#5b6b7f">弱項與熟悉的題目混在一起重溫</text>
  </g>

  <line x1="400" y1="210" x2="478" y2="210" stroke="#0b5c8a" stroke-width="2" marker-end="url(#ast-ba-arrow)"/>

  <!-- 用後 -->
  <rect x="490" y="20" width="370" height="380" rx="18" fill="url(#ast-ba-after)" stroke="#4be3db"/>
  <text x="514" y="60" font-size="20" font-weight="700" fill="#0b5c8a">用後：AS 面試溫習</text>
  <g font-size="15" fill="#1e2a3a">
    <circle cx="522" cy="104" r="14" fill="#ffffff" stroke="#4be3db"/><text x="522" y="109" text-anchor="middle" font-size="13" fill="#0b5c8a">✓</text>
    <text x="548" y="100">329 張一問一答的抽認卡</text><text x="548" y="122" font-size="13" fill="#5b6b7f">由 60 份考卷歸納，標示出現頻率</text>
    <circle cx="522" cy="170" r="14" fill="#ffffff" stroke="#4be3db"/><text x="522" y="175" text-anchor="middle" font-size="13" fill="#0b5c8a">✓</text>
    <text x="548" y="166">每個答案均附出處</text><text x="548" y="188" font-size="13" fill="#5b6b7f">可追溯至法例條文或作業備考</text>
    <circle cx="522" cy="236" r="14" fill="#ffffff" stroke="#4be3db"/><text x="522" y="241" text-anchor="middle" font-size="13" fill="#0b5c8a">✓</text>
    <text x="548" y="232">以法例原文為準</text><text x="548" y="254" font-size="13" fill="#5b6b7f">教材錯誤已逐項更正並提示</text>
    <circle cx="522" cy="302" r="14" fill="#ffffff" stroke="#4be3db"/><text x="522" y="307" text-anchor="middle" font-size="13" fill="#0b5c8a">✓</text>
    <text x="548" y="298">按掌握程度自動出題</text><text x="548" y="320" font-size="13" fill="#5b6b7f">弱項出得密，熟悉的題目逐步退役</text>
  </g>
  <text x="514" y="376" font-size="13" fill="#0b5c8a" font-weight="600">每節 10 至 40 題，約 10 至 30 分鐘</text>
</svg>
