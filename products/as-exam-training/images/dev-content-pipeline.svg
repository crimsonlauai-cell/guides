<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="ast-pipe-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5c8a"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#1e2a3a">語料抽取的三級分流</text>
  <text x="20" y="58" font-size="13" fill="#5b6b7f">按 PDF 類型選最便宜而可靠的方法，只有掃描件才使用視覺模型</text>

  <rect x="20" y="170" width="150" height="90" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="95" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1e2a3a">一份 PDF</text>
  <text x="95" y="232" text-anchor="middle" font-size="13" fill="#5b6b7f">先判斷類型</text>

  <g stroke="#0b5c8a" stroke-width="1.8" fill="none" marker-end="url(#ast-pipe-arrow)">
    <path d="M172 200 C 220 200, 220 120, 262 120"/>
    <path d="M172 215 L262 215"/>
    <path d="M172 230 C 220 230, 220 310, 262 310"/>
  </g>

  <!-- tier 1 -->
  <rect x="266" y="80" width="370" height="80" rx="14" fill="#f4fbfb" stroke="#4be3db"/>
  <text x="286" y="110" font-size="15" font-weight="700" fill="#0b5c8a">香港法例 → e-Legislation RTF 匯出</text>
  <text x="286" y="136" font-size="13" fill="#1e2a3a">官方原文，免 OCR、免視覺讀取；可信度最高</text>
  <!-- tier 2 -->
  <rect x="266" y="175" width="370" height="80" rx="14" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="286" y="205" font-size="15" font-weight="700" fill="#1e2a3a">有文字層的 PDF → 直接抽取</text>
  <text x="286" y="231" font-size="13" fill="#1e2a3a">PNAP、PNRC、守則大多屬此類；零 token 成本</text>
  <!-- tier 3 -->
  <rect x="266" y="270" width="370" height="80" rx="14" fill="#fff8ec" stroke="#f3cf8e"/>
  <text x="286" y="300" font-size="15" font-weight="700" fill="#b45309">掃描件 → 渲染成圖，由模型視覺轉錄</text>
  <text x="286" y="326" font-size="13" fill="#1e2a3a">培訓教材等；兩頁或四頁一版以節省用量</text>

  <g stroke="#0b5c8a" stroke-width="1.8" marker-end="url(#ast-pipe-arrow)">
    <line x1="638" y1="120" x2="690" y2="200"/>
    <line x1="638" y1="215" x2="690" y2="215"/>
    <line x1="638" y1="310" x2="690" y2="230"/>
  </g>
  <rect x="694" y="150" width="186" height="130" rx="14" fill="#ffffff" stroke="#4be3db"/>
  <text x="712" y="182" font-size="15" font-weight="700" fill="#1e2a3a">Resource/_text/</text>
  <text x="712" y="208" font-size="13" fill="#5b6b7f">每檔頭註明來源</text>
  <text x="712" y="230" font-size="13" fill="#5b6b7f">及抽取方式</text>
  <text x="712" y="260" font-size="13" fill="#0b5c8a" font-weight="600">可入 git 追蹤</text>

  <rect x="20" y="370" width="860" height="36" rx="10" fill="#fef3c7"/>
  <text x="36" y="393" font-size="13" fill="#b45309">⚠ 抽取後必須檢查內容是否為空。本專案曾有 21 份檔案 OCR 後全部空白而未被發現，導致後續核實失準。</text>
</svg>
