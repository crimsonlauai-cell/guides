<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <radialGradient id="tg-hero-glow1" cx="0.8" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#4be3db" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4be3db" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tg-hero-glow2" cx="0.1" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <filter id="tg-hero-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b5c8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="560" height="400" rx="24" fill="#f7fbfd"/>
  <rect width="560" height="400" rx="24" fill="url(#tg-hero-glow1)"/>
  <rect width="560" height="400" rx="24" fill="url(#tg-hero-glow2)"/>

  <!-- 手機 -->
  <g filter="url(#tg-hero-shadow)">
    <rect x="170" y="30" width="220" height="340" rx="30" fill="#ffffff" fill-opacity="0.92" stroke="#e3edf3"/>
  </g>
  <!-- 地圖 -->
  <rect x="186" y="62" width="188" height="120" rx="12" fill="#eef4ee"/>
  <path d="M186 132 L374 98" stroke="#ffffff" stroke-width="10"/>
  <path d="M250 62 L270 182" stroke="#ffffff" stroke-width="7"/>
  <path d="M320 62 L306 182" stroke="#f3b4b4" stroke-width="12" opacity="0.6"/>
  <g font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="300" cy="122" r="9" fill="#60a5fa"/><text x="300" y="126">Y</text>
    <circle cx="240" cy="100" r="8" fill="#d94a4a"/><text x="240" y="104">1</text>
    <circle cx="345" cy="88" r="8" fill="#d94a4a"/><text x="345" y="92">2</text>
    <circle cx="214" cy="150" r="8" fill="#d94a4a"/><text x="214" y="154">3</text>
    <circle cx="338" cy="160" r="8" fill="#d94a4a"/><text x="338" y="164">4</text>
  </g>
  <!-- 名單 -->
  <g font-size="11" fill="#1e2a3a">
    <text x="190" y="206" font-weight="700">1️⃣ 風雲児</text>
    <text x="190" y="222" fill="#0b5c8a">⭐ 食べログ 3.80 · Google 4.3</text>
    <text x="190" y="238" fill="#5b6b7f">🚶 6 分鐘 · 380m</text>
    <text x="190" y="262" font-weight="700">2️⃣ 五ノ神製作所</text>
    <text x="190" y="278" fill="#0b5c8a">⭐ 食べログ 3.77 · Google 4.1</text>
    <text x="190" y="294" fill="#5b6b7f">🚶 9 分鐘 · 610m</text>
  </g>
  <g font-size="10" fill="#0b5c8a" text-anchor="middle">
    <rect x="186" y="314" width="58" height="24" rx="8" fill="#e8f7f6"/><text x="215" y="330">🚶 近</text>
    <rect x="251" y="314" width="58" height="24" rx="8" fill="#4be3db"/><text x="280" y="330" fill="#0f2233">⭐ 好食</text>
    <rect x="316" y="314" width="58" height="24" rx="8" fill="#e8f7f6"/><text x="345" y="330">⚡ 即食</text>
  </g>

  <!-- 側邊徽章 -->
  <g filter="url(#tg-hero-shadow)">
    <rect x="30" y="92" width="120" height="70" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff"/>
    <rect x="410" y="210" width="126" height="70" rx="16" fill="#ffffff" fill-opacity="0.85" stroke="#ffffff"/>
  </g>
  <text x="90" y="120" text-anchor="middle" font-size="12" fill="#5b6b7f">第一段</text>
  <text x="90" y="146" text-anchor="middle" font-size="20" font-weight="700" fill="#0b5c8a">≈ 2 秒</text>
  <text x="473" y="238" text-anchor="middle" font-size="12" fill="#5b6b7f">每月成本</text>
  <text x="473" y="264" text-anchor="middle" font-size="20" font-weight="700" fill="#0b5c8a">US$0</text>
</svg>
