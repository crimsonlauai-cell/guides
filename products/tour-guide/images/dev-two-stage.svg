<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <marker id="tg-two-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0b5c8a"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#1e2a3a">兩段式回覆：先給保底結果，再覆寫同一條訊息</text>
  <text x="20" y="58" font-size="13" fill="#5b6b7f">第二段在背景執行，不 await，bot 在等待期間仍可回應按鈕</text>

  <!-- time axis -->
  <line x1="60" y1="360" x2="880" y2="360" stroke="#d9e2ea" stroke-width="2"/>
  <g font-size="12" fill="#5b6b7f" text-anchor="middle">
    <text x="60" y="382">0 秒</text><text x="200" y="382">2 秒</text><text x="500" y="382">≈ 10 秒</text><text x="820" y="382">≈ 20 秒</text>
  </g>

  <!-- lanes -->
  <g font-size="13" font-weight="700" fill="#5b6b7f">
    <text x="20" y="104">第一段</text>
    <text x="20" y="184">食べログ</text>
    <text x="20" y="234">本地 blog</text>
    <text x="20" y="284">繁中摘要</text>
  </g>
  <rect x="70" y="84" width="130" height="30" rx="8" fill="#4be3db"/>
  <text x="80" y="104" font-size="12" fill="#0f2233">Places 取池 + 過閘</text>

  <rect x="210" y="164" width="300" height="30" rx="8" fill="#0b5c8a"/>
  <text x="222" y="184" font-size="12" fill="#ffffff">Serper × 最多 8 間，並行 3 個</text>
  <rect x="210" y="214" width="610" height="30" rx="8" fill="#60a5fa" fill-opacity="0.7"/>
  <text x="222" y="234" font-size="12" fill="#0f2233">Gemini grounding（最慢，最早開始；時限 45 秒）</text>
  <rect x="520" y="264" width="300" height="30" rx="8" fill="#9aa8b5" fill-opacity="0.8"/>
  <text x="532" y="284" font-size="12" fill="#0f2233">批次摘要五間（時限 40 秒）</text>

  <!-- messages -->
  <rect x="210" y="76" width="250" height="46" rx="10" fill="#ffffff" stroke="#4be3db"/>
  <text x="222" y="96" font-size="12" fill="#1e2a3a">① replyWithPhoto：地圖 + 五間</text>
  <text x="222" y="113" font-size="12" fill="#5b6b7f">底部「🔍 分析緊…」</text>
  <rect x="640" y="76" width="260" height="46" rx="10" fill="#ffffff" stroke="#0b5c8a"/>
  <text x="652" y="96" font-size="12" fill="#1e2a3a">② editMessageCaption 覆寫</text>
  <text x="652" y="113" font-size="12" fill="#5b6b7f">重新排序、補分數與說明</text>
  <path d="M820 262 L820 126" stroke="#0b5c8a" stroke-width="1.6" stroke-dasharray="4 4" fill="none" marker-end="url(#tg-two-arrow)"/>

  <rect x="60" y="310" width="840" height="30" rx="8" fill="#fef3c7"/>
  <text x="76" y="330" font-size="12" fill="#b45309">購物分類：跳過食べログ，要等 blog 結果回來才能排序（Google 評分 + 本地 blog 提及加 0.6 分）</text>
</svg>
