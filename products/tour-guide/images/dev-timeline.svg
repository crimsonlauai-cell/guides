<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <defs>
    <linearGradient id="tg-tl-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4be3db"/>
      <stop offset="1" stop-color="#0b5c8a"/>
    </linearGradient>
  </defs>
  <text x="20" y="34" font-size="19" font-weight="700" fill="#1e2a3a">開發時間線（2026 年）</text>
  <text x="20" y="58" font-size="13" fill="#5b6b7f">紅點為推翻原設計的轉折</text>

  <rect x="40" y="140" width="840" height="6" rx="3" fill="url(#tg-tl-line)"/>
  <g font-size="13" text-anchor="middle">
    <circle cx="80" cy="143" r="9" fill="#ffffff" stroke="#4be3db" stroke-width="3"/>
    <text x="80" y="116" font-weight="700" fill="#1e2a3a">8/8 ①</text>
    <text x="80" y="176" fill="#1e2a3a">需求訪談</text>
    <text x="80" y="196" fill="#5b6b7f">資料源分工定案</text>

    <circle cx="260" cy="143" r="10" fill="#d94a4a"/>
    <text x="260" y="116" font-weight="700" fill="#1e2a3a">8/8 ②</text>
    <text x="260" y="176" fill="#b91c1c">Step 0 證偽</text>
    <text x="260" y="196" fill="#5b6b7f">Gemini 取不到食べログ → Serper</text>

    <circle cx="440" cy="143" r="10" fill="#d94a4a"/>
    <text x="440" y="116" font-weight="700" fill="#1e2a3a">8/8 ③</text>
    <text x="440" y="176" fill="#b91c1c">改為分類優先</text>
    <text x="440" y="196" fill="#5b6b7f">候選池被連鎖店佔據</text>

    <circle cx="620" cy="143" r="9" fill="#ffffff" stroke="#0b5c8a" stroke-width="3"/>
    <text x="620" y="116" font-weight="700" fill="#1e2a3a">8/9</text>
    <text x="620" y="176" fill="#1e2a3a">購物層、服務化</text>
    <text x="620" y="196" fill="#5b6b7f">工作排程器取代 NSSM</text>

    <circle cx="820" cy="143" r="9" fill="#0b5c8a"/>
    <text x="820" y="116" font-weight="700" fill="#1e2a3a">8/16–19</text>
    <text x="820" y="176" fill="#1e2a3a">更新位置按鈕</text>
    <text x="820" y="196" fill="#5b6b7f">撰寫重建文件</text>
  </g>

  <rect x="20" y="226" width="880" height="54" rx="12" fill="#f4fbfb" stroke="#bfeeea"/>
  <text x="40" y="250" font-size="13" fill="#1e2a3a">主線 session 50 條指示；核心開發集中在 8 月 8 日至 9 日兩天。</text>
  <text x="40" y="270" font-size="13" fill="#5b6b7f">先用獨立腳本驗證資料源（Step 0 至 0c），通過門檻才寫正式程式碼。</text>
</svg>
