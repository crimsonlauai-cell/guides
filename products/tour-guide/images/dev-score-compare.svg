<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
  <text x="20" y="34" font-size="19" font-weight="700" fill="#1e2a3a">同一批新宿拉麵店：兩種評分的分佈</text>
  <text x="20" y="58" font-size="13" fill="#5b6b7f">端到端測試實測數據；Google 評分集中在窄帶，食べログ分數拉得開</text>

  <!-- Google -->
  <rect x="20" y="80" width="420" height="300" rx="16" fill="#ffffff" stroke="#d9e2ea"/>
  <text x="40" y="112" font-size="15" font-weight="700" fill="#5b6b7f">Google 評分（1–5）</text>
  <line x1="60" y1="330" x2="420" y2="330" stroke="#d9e2ea"/>
  <g font-size="12" fill="#5b6b7f" text-anchor="middle">
    <text x="60" y="350">4.0</text><text x="240" y="350">4.25</text><text x="420" y="350">4.5</text>
  </g>
  <rect x="204" y="140" width="144" height="180" rx="10" fill="#9aa8b5" fill-opacity="0.18"/>
  <g font-size="12" fill="#1e2a3a">
    <circle cx="276" cy="170" r="7" fill="#9aa8b5"/><text x="288" y="174">風雲児 4.3</text>
    <circle cx="204" cy="205" r="7" fill="#9aa8b5"/><text x="216" y="209">五ノ神製作所 4.1</text>
    <circle cx="276" cy="240" r="7" fill="#9aa8b5"/><text x="288" y="244">一蘭 中央東口 4.3</text>
    <circle cx="348" cy="275" r="7" fill="#9aa8b5"/><text x="248" y="300">一蘭 歌舞伎町 4.4</text>
  </g>
  <text x="40" y="372" font-size="13" fill="#b45309">四間落在 0.3 分之內，無法分辨好壞</text>

  <!-- Tabelog -->
  <rect x="460" y="80" width="420" height="300" rx="16" fill="#f4fbfb" stroke="#4be3db"/>
  <text x="480" y="112" font-size="15" font-weight="700" fill="#0b5c8a">食べログ分數（1–5）</text>
  <line x1="500" y1="330" x2="860" y2="330" stroke="#bfeeea"/>
  <g font-size="12" fill="#5b6b7f" text-anchor="middle">
    <text x="500" y="350">3.0</text><text x="680" y="350">3.45</text><text x="860" y="350">3.9</text>
  </g>
  <g font-size="12" fill="#1e2a3a">
    <circle cx="820" cy="170" r="7" fill="#0b5c8a"/><text x="706" y="174">風雲児 3.80</text>
    <circle cx="808" cy="205" r="7" fill="#0b5c8a"/><text x="670" y="209">五ノ神製作所 3.77</text>
    <circle cx="580" cy="240" r="7" fill="#4be3db"/><text x="592" y="244">一蘭 中央東口 3.20</text>
    <circle cx="536" cy="275" r="7" fill="#4be3db"/><text x="548" y="279">一蘭 歌舞伎町 3.09</text>
  </g>
  <text x="480" y="372" font-size="13" fill="#0b5c8a">拉開 0.71 分，排序主軸改用食べログ</text>
</svg>
